name: Deploy to cPanel (FTP)

# Builds the landing + app and uploads landing, app and the PHP API to the
# egolimited.com cPanel host over FTP on every push to main (or run manually).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-egolimited
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- quality gates: nothing reaches production that fails these ----
      # This workflow deploys straight to the LIVE site with no staging step, so CI is the
      # only gate that exists. A failing step here stops the upload — that is the point.
      - name: PHP syntax check + API tests (blocking)
        run: |
          find api -name '*.php' -print0 | xargs -0 -n1 php -l
          php api/tests/run.php

      - name: Install deps
        run: |
          npm ci --prefix app
          npm ci --prefix landing

      - name: Test app (blocking)
        run: npm test --prefix app

      - name: Lint (blocking)
        # Now blocking. It was report-only while the app carried ~43 eslint errors thrown by the
        # hand-rolled useEffect-fetch pattern; the TanStack Query migration deleted that pattern
        # (and its violations) rather than papering over them, and the residue — components
        # declared during render, Math.random() during render, a mirror copy of the query cache
        # in useState — turned out to be real bugs worth fixing. Errors are now 0.
        # Warnings are still allowed through; only errors fail the build.
        run: |
          npm run lint --prefix app
          npm run lint --prefix landing

      # ---- build the two SPAs ----
      - name: Build app (base /app/)
        working-directory: app
        env:
          # Public Clerk key (repository variable, not a secret). Without it the app falls back to the
          # legacy own-login, so set it under Settings > Secrets and variables > Actions > Variables.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          npx tsc -b
          npx vite build --base=/app/

      - name: Build landing (base /)
        working-directory: landing
        run: |
          npx tsc -b
          npx vite build --base=/

      # ---- upload each surface to its cPanel dir ----
      # IMPORTANT: the deploy FTP account is chrooted to the egolimited.com docroot,
      # so every server-dir below is relative to THAT dir — not to /home. An earlier
      # "egolimited.com/" prefix created a phantom ~/egolimited.com/egolimited.com/
      # and the live site never updated. Root of the FTP home === the landing docroot.
      - name: Deploy landing → docroot root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./landing/dist/
          server-dir: ./
          # The landing sync owns the docroot ROOT, which also holds the app/ and api/
          # subtrees + a stale phantom egolimited.com/ dir. Protect all three (both the
          # dir entry and its contents) so a root sync never uploads into or deletes them.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            app/
            app/**
            api/
            api/**
            egolimited.com/
            egolimited.com/**

      - name: Deploy app → egolimited.com/app/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./app/dist/
          server-dir: app/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy API → egolimited.com/api/  (preserve server config/uploads/.htaccess)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./api/
          server-dir: api/
          # Never upload or delete server-side secrets/state.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            config.php
            config.sample.php
            error_log
            .htaccess
            uploads/**
            .impeccable/**

      # ---- prove the deploy actually landed ----
      # We have shipped a white screen to production twice (2026-07-08). A green build is
      # not evidence the live site works — only the live site is. Fail loudly if it doesn't.
      # NOTE: hits the origin through Cloudflare; index.html is uncached/dynamic so a stale
      # edge copy is not expected to mask a bad deploy here.
      - name: Smoke test the live site
        run: |
          set -euo pipefail
          echo "→ API health"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://egolimited.com/api/health | tee /dev/stderr | grep -q '"ok":true'

          echo "→ App shell references a real hashed bundle"
          app_html=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://egolimited.com/app/)
          bundle=$(printf '%s' "$app_html" | grep -oE '/app/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          test -n "$bundle" || { echo "::error::no hashed app bundle in /app/ index.html"; printf '%s' "$app_html" | head -40; exit 1; }
          echo "   bundle: $bundle"
          curl -fsS -o /dev/null "https://egolimited.com${bundle}"

          echo "→ Landing responds"
          curl -fsS -o /dev/null https://egolimited.com/
          echo "✅ smoke test passed"
