name: Deploy to cPanel (FTP)

# Builds the landing + app and uploads landing, app and the PHP API to the
# egolimited.com cPanel host over FTP on every push to main (or run manually).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-egolimited
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- build the two SPAs ----
      - name: Build app (base /app/)
        working-directory: app
        run: |
          npm ci
          npx tsc -b
          npx vite build --base=/app/

      - name: Build landing (base /)
        working-directory: landing
        run: |
          npm ci
          npx tsc -b
          npx vite build --base=/

      # ---- upload each surface to its cPanel dir ----
      # IMPORTANT: the deploy FTP account is chrooted to the egolimited.com docroot,
      # so every server-dir below is relative to THAT dir — not to /home. An earlier
      # "egolimited.com/" prefix created a phantom ~/egolimited.com/egolimited.com/
      # and the live site never updated. Root of the FTP home === the landing docroot.
      - name: Deploy landing → docroot root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./landing/dist/
          server-dir: ./
          # The landing sync owns the docroot ROOT, which also holds the app/ and api/
          # subtrees + a stale phantom egolimited.com/ dir. Protect all three (both the
          # dir entry and its contents) so a root sync never uploads into or deletes them.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            app/
            app/**
            api/
            api/**
            egolimited.com/
            egolimited.com/**

      - name: Deploy app → egolimited.com/app/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./app/dist/
          server-dir: app/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy API → egolimited.com/api/  (preserve server config/uploads/.htaccess)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./api/
          server-dir: api/
          # Never upload or delete server-side secrets/state.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            config.php
            config.sample.php
            error_log
            .htaccess
            uploads/**
            .impeccable/**
